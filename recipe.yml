name: Varbase AI Default
description: 'Applies Varbase AI Base and every Varbase AI recipe in one step, with MariaDB as the vector database. For demos, and for sites that want the full Varbase AI stack.'
type: Varbase AI
recipes:
  - varbase_ai_base
  - varbase_ai_vdb_mariadb
  - varbase_ai_search_base
  - varbase_ai_chatbot_base
  - varbase_ai_answers_base
  - varbase_ai_content_operations_base
  - varbase_ai_mcp_server_base
  - varbase_ai_readable_base
  - varbase_ai_seo
  - varbase_ai_media_base
  - varbase_ai_figma_base
input:
  # Shows the input form so the inputs of the applied recipes are collected.
  _form_trigger:
    data_type: string
    description: 'Internal trigger to ensure the recipe input form is displayed so sub-recipe inputs are collected.'
    form:
      '#type': 'hidden'
      '#value': '1'
    default:
      source: value
      value: '1'
